spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/imagevault
    username: postgres
    password: admin
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_SECRET_ID:placeholder}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: profile, email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:placeholder}
            client-secret: ${FACEBOOK_CLIENT_SECRET:plcaholder}
            redirect-uri: http://localhost:8080/login/oauth2/code/facebook
            authorization-grant-type: authorization_code
            scope: public_profile, email

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    algorithm: PBEWITHHMACSHA512ANDAES_256

jwt:
  secret: ${JWT_SECRET:FZNdMfiY82GLxjG6WF77xuN34E8izBFqatWVY5hU1Pv0LxeLLZjAkh7dKi0Z}
